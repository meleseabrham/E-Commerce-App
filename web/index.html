<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MeHal Gebeya - Ethiopian E-commerce Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MeHal Gebeya">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>MeHal Gebeya</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Web-specific meta tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18804B">
  <meta name="msapplication-TileColor" content="#18804B">
  <meta name="theme-color" content="#18804B" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18804B" media="(prefers-color-scheme: dark)">
  
  <!-- Preload critical resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Loading indicator -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #18804B !important;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #18804B !important;
    }
    .loading-container {
      text-align: center;
      color: white;
      padding: 20px;
      max-width: 280px;
      width: 100%;
    }
    .app-icon {
      width: 130px;
      height: 130px;
      border-radius: 28px;
      margin: 0 auto 20px;
      display: block;
      object-fit: contain;
    }
    .app-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 6px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .app-subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 24px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background-color:#18804B;">
  <div id="loading-screen" class="loading-container">
    <img src="icons/Icon-512.png" class="app-icon" alt="MeHal Gebeya" />
    <div class="app-title">MeHal Gebeya</div>
    <div class="app-subtitle">Ethiopian E-commerce</div>
    <div class="loading-spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Unregister old service workers so index.html is never served stale
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let r of registrations) { r.unregister(); }
      });
    }
    // Hide HTML splash once Flutter takes over
    window.addEventListener('flutter-first-frame', function() {
      const el = document.getElementById('loading-screen');
      if (el) el.style.display = 'none';
    });
  </script>
</body>
</html>
